name: cro-sit
services:
  vaultwarden:
    image: vaultwarden/server:1.37.4
    restart: "no"
    environment:
      DOMAIN: http://localhost:8223
      SIGNUPS_ALLOWED: "${CRO_SIT_SIGNUPS:-false}"
      SIGNUPS_DOMAINS_WHITELIST: ""
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      ROCKET_PORT: "80"
      LOG_LEVEL: warn
    volumes:
      - vault-data:/data
    networks:
      - sit
    security_opt:
      - no-new-privileges:true
  gateway:
    image: node:24-alpine
    command: ["node", "/proxy.mjs"]
    depends_on: [vaultwarden]
    ports:
      - "127.0.0.1:8223:8223"
    volumes:
      - ./proxy.mjs:/proxy.mjs:ro
    networks: [sit, access]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
networks:
  access: {}
  sit:
    internal: true
volumes:
  vault-data:
