name: cro-sit
services:
  vaultwarden:
    image: vaultwarden/server:1.37.4
    restart: "no"
    environment:
      DOMAIN: http://localhost:8223
      SIGNUPS_ALLOWED: "${CRO_SIT_SIGNUPS:-false}"
      SIGNUPS_DOMAINS_WHITELIST: ""
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      ROCKET_PORT: "80"
      LOG_LEVEL: warn
    ports:
      - "127.0.0.1:8223:80"
    volumes:
      - vault-data:/data
    networks:
      - sit
    security_opt:
      - no-new-privileges:true
networks:
  sit:
    internal: true
volumes:
  vault-data:
